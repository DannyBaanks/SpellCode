[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spellcode"
version = "0.1.0"
description = "Esolang experimental donde hechizos representan operaciones computacionales"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/DannyBaanks/SpellCode"

[project.scripts]
spellcode = "spellcode.cli:main"

[tool.setuptools]
packages = ["spellcode"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
